name: Compatibility report
description: Report hardware/OS compatibility results for a capability
title: "[compat]: "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Helps build the compatibility matrix. Include exact device models and connection types
        where possible. **Redact serials, pairing codes, host names, and other identifying data.**
  - type: input
    id: openswitch-version
    attributes:
      label: OpenSwitch version
      placeholder: "e.g. 47.1"
    validations:
      required: false
  - type: input
    id: mac-model
    attributes:
      label: Mac model & chip
      placeholder: "e.g. Mac mini M2 (Apple Silicon)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS build
      placeholder: "e.g. 15.5 (24F74)"
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: Display model & firmware
      placeholder: "e.g. Dell U2720Q (firmware M3B103)"
    validations:
      required: true
  - type: input
    id: keyboard
    attributes:
      label: Keyboard model and connection
      placeholder: "e.g. MX Keys S, Bluetooth"
    validations:
      required: false
  - type: input
    id: mouse
    attributes:
      label: Mouse model and connection
      placeholder: "e.g. MX Anywhere 3S, Bolt receiver"
    validations:
      required: false
  - type: dropdown
    id: route
    attributes:
      label: Route
      options: ["Direct", "Thunderbolt dock", "USB-C hub", "KVM", "Adapter", "Wireless"]
    validations:
      required: true
  - type: dropdown
    id: capability
    attributes:
      label: Capability tested
      options:
        - Logical disconnect / reconnect
        - DDC brightness
        - DDC volume / contrast / input
        - Resolution / refresh / rotation modes
        - HDR / XDR
        - Mirroring / main display
        - Virtual display
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options: ["Works (verified)", "Works (unverified read-back)", "Degraded", "Fails"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: |
        For input switching, say whether the monitor, keyboard, and mouse each switched
        successfully, and whether you tested both directions. Do not attach raw serial numbers
        or pairing secrets.
